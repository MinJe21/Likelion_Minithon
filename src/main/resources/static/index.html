<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>다시, 학교 — 진단·체크포인트 (v2 API 테스트)</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; background:#f4f5f7; color:#1a1f2b; }
    .wrap { max-width:860px; margin:0 auto; padding:20px 16px 60px; }
    header.top { background:#1f4e79; color:#fff; padding:18px 16px; }
    header.top h1 { margin:0; font-size:20px; } header.top p { margin:4px 0 0; font-size:13px; opacity:.85; }
    h2.section { font-size:15px; color:#4a5568; margin:22px 0 10px; }
    .card { background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:16px; margin-bottom:12px; }
    .muted { color:#718096; font-size:13px; }
    .row { display:flex; gap:8px; flex-wrap:wrap; }
    input[type=text], select { padding:9px 11px; border:1px solid #cbd5e0; border-radius:8px; font-size:14px; }
    button { cursor:pointer; border:0; border-radius:8px; padding:10px 16px; background:#1f4e79; color:#fff; font-size:14px; }
    button.ghost { background:#fff; color:#1f4e79; border:1px solid #1f4e79; } button.sm { padding:6px 12px; font-size:13px; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .school-item { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:11px 12px; border:1px solid #e2e8f0; border-radius:10px; margin-bottom:8px; background:#fff; }
    .school-item .name { font-weight:600; } .school-item .desc { font-size:12px; color:#718096; margin-top:2px; }
    .badge { display:inline-block; padding:2px 10px; border-radius:20px; font-size:12px; font-weight:700; }
    .g-hi { background:#e6f4ea; color:#1e7d34; } .g-mid { background:#fef4e5; color:#b7791f; } .g-lo { background:#fde8e8; color:#c53030; } .g-def { background:#edf2f7; color:#4a5568; }
    .metric { border:1px solid #e2e8f0; border-radius:10px; padding:10px 12px; margin-bottom:8px; }
    .metric .head { display:flex; justify-content:space-between; align-items:center; }
    .metric .k { font-weight:600; }
    .rec-card { border:1px solid #d6dee8; border-radius:12px; padding:14px; margin-bottom:12px; } .rec-card h3 { margin:0 0 6px; font-size:16px; }
    ul { margin:6px 0; padding-left:18px; } li { margin:3px 0; font-size:14px; }
    .tag { display:inline-block; font-size:12px; padding:3px 9px; border-radius:6px; margin:3px 4px 0 0; }
    .tag.good { background:#e6f4ea; color:#1e7d34; } .tag.risk { background:#fdecec; color:#c53030; } .tag.alt { background:#eef2ff; color:#3730a3; }
    .cp { border:1px solid #e2e8f0; border-left:4px solid #1f4e79; border-radius:8px; padding:10px 12px; margin-bottom:8px; }
    .cp .cat { font-weight:700; } .cp .note { margin:4px 0; font-size:14px; } .cp .tip { font-size:13px; color:#4a5568; }
    .p-HIGH { color:#c53030; } .p-MEDIUM { color:#b7791f; } .p-LOW { color:#4a5568; }
    .hidden { display:none; } .loading { text-align:center; color:#718096; padding:24px; }
    .err { background:#fde8e8; color:#9b1c1c; padding:12px; border-radius:8px; font-size:13px; white-space:pre-wrap; }
    .pill-select { display:flex; gap:10px; }
    .pill { flex:1; text-align:center; padding:16px; border:2px solid #cbd5e0; border-radius:12px; cursor:pointer; background:#fff; } .pill.active { border-color:#1f4e79; background:#eef4fa; }
    .step-back { background:none; color:#718096; padding:4px 0; font-size:13px; }
  </style>
</head>
<body>
  <header class="top"><div class="wrap"><h1>🏫 다시, 학교</h1><p>폐교 활용 진단 · 최종 체크포인트 · v2 API 테스트</p></div></header>
  <div class="wrap">
    <section id="step-select">
      <h2 class="section">1. 폐교 선택 <span class="muted" id="school-count"></span></h2>
      <div class="card"><div class="row">
        <input type="text" id="f-keyword" placeholder="폐교명 검색" style="flex:2 1 160px" />
        <input type="text" id="f-region" placeholder="지역(예: 경상북도, 영천시)" style="flex:2 1 160px" />
        <select id="f-level"><option value="">학교급 전체</option><option>초등학교</option><option>중학교</option><option>고등학교</option></select>
        <select id="f-status"><option value="">활용현황 전체</option><option>자체활용</option><option>대부</option><option>미활용</option></select>
        <button class="sm" onclick="applyFilter()">검색</button>
      </div></div>
      <div id="school-list"></div>
      <div class="row" style="justify-content:center; margin-top:8px"><button class="ghost sm hidden" id="more-btn" onclick="loadMore()">더 보기</button></div>
    </section>

    <section id="step-mode" class="hidden">
      <button class="step-back" onclick="goSelect()">← 다른 폐교 선택</button>
      <h2 class="section">2. 선택한 폐교</h2>
      <div class="card" id="school-detail"></div>
      <h2 class="section">3. 아이디어가 있으신가요?</h2>
      <div class="pill-select">
        <div class="pill" id="pill-empty" onclick="setMode('empty')"><div style="font-size:22px">💡</div><div>아이디어가 없어요</div><div class="muted">활용모델 3개 추천</div></div>
        <div class="pill" id="pill-exist" onclick="setMode('exist')"><div style="font-size:22px">✍️</div><div>아이디어가 있어요</div><div class="muted">아이디어 적합성 진단</div></div>
      </div>
      <div id="idea-input-wrap" class="card hidden" style="margin-top:12px">
        <input type="text" id="idea-input" style="width:100%" placeholder="예: 이 폐교를 유아 체험센터로 활용하고 싶어요 (10자 이상)" />
      </div>
      <div class="row" style="margin-top:14px"><button id="diagnose-btn" onclick="runDiagnose()" disabled>AI 진단 실행</button></div>
    </section>

    <section id="step-result" class="hidden">
      <button class="step-back" onclick="goMode()">← 다시 진단</button>
      <div id="result"></div>
      <div id="checkpoints"></div>
    </section>
  </div>

<script>
const S={page:0,size:20,filters:{},school:null,mode:null,lastEval:null,lastRecs:null};
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const GRADE_KO={VERY_LOW:'매우 낮음',LOW:'낮음',MEDIUM:'보통',HIGH:'높음',VERY_HIGH:'매우 높음'};
const CAT_KO={ADMINISTRATION:'행정',FACILITY:'시설',BUDGET:'예산',DEMAND:'수요',OPERATING_SUSTAINABILITY:'운영 지속성',COMMUNITY_ACCEPTANCE:'지역수용성'};
const PRIO_KO={HIGH:'우선 확인',MEDIUM:'확인 필요',LOW:'참고'};
const gradeCls=g=>['HIGH','VERY_HIGH'].includes(g)?'g-hi':(g==='MEDIUM'?'g-mid':(['LOW','VERY_LOW'].includes(g)?'g-lo':'g-def'));
const gradeBadge=g=>`<span class="badge ${gradeCls(g)}">${GRADE_KO[g]||g||'-'}</span>`;

async function loadSchools(reset){
  if(reset){S.page=0;$('school-list').innerHTML='';}
  const q=new URLSearchParams({...S.filters,page:S.page,size:S.size});
  const data=await (await fetch('/api/schools?'+q)).json();
  $('school-count').textContent=`(총 ${data.total.toLocaleString()}개)`;
  data.items.forEach(s=>{
    const el=document.createElement('div');el.className='school-item';
    el.innerHTML=`<div><div class="name">${esc(s.name)}</div><div class="desc">${esc(s.region)} · ${esc(s.shortDescription)}</div></div><button class="sm">선택</button>`;
    el.querySelector('button').onclick=()=>selectSchool(s.schoolId);
    $('school-list').appendChild(el);
  });
  $('more-btn').classList.toggle('hidden',(S.page+1)*S.size>=data.total);
}
function applyFilter(){S.filters={keyword:$('f-keyword').value,region:$('f-region').value,level:$('f-level').value,status:$('f-status').value};loadSchools(true);}
function loadMore(){S.page++;loadSchools(false);}

async function selectSchool(id){
  const s=await (await fetch('/api/schools/'+id)).json(); S.school=s; S.mode=null;
  $('school-detail').innerHTML=`<div style="font-size:17px;font-weight:700">${esc(s.name)}</div>
    <div class="muted" style="margin:4px 0 10px">${esc(s.region)} · ${esc(s.eduOffice||'')}</div>
    <div class="row" style="gap:16px">
      <div><div class="muted">학교급</div>${esc(s.schoolLevel||'-')}</div>
      <div><div class="muted">폐교연도</div>${esc(s.closedYear||'-')}</div>
      <div><div class="muted">활용현황</div>${esc(s.utilizationStatus||'-')}</div>
      <div><div class="muted">건물면적</div>${s.buildingArea?esc(s.buildingArea)+'㎡':'-'}</div>
      <div><div class="muted">부지면적</div>${s.landArea?esc(s.landArea)+'㎡':'-'}</div></div>
    <div class="muted" style="margin-top:10px">${esc(s.roadAddress||s.jibunAddress||'')}</div>`;
  $('pill-empty').classList.remove('active');$('pill-exist').classList.remove('active');
  $('idea-input-wrap').classList.add('hidden');$('diagnose-btn').disabled=true; show('step-mode');
}
function setMode(m){S.mode=m;$('pill-empty').classList.toggle('active',m==='empty');$('pill-exist').classList.toggle('active',m==='exist');$('idea-input-wrap').classList.toggle('hidden',m!=='exist');$('diagnose-btn').disabled=false;}
function goSelect(){show('step-select');} function goMode(){show('step-mode');}
function show(id){['step-select','step-mode','step-result'].forEach(x=>$(x).classList.toggle('hidden',x!==id));window.scrollTo(0,0);}

// CSV 폐교 -> v2 계약 school 객체
function toSchoolInput(s){
  return { schoolId:s.schoolId, schoolName:s.name, address:s.roadAddress||s.jibunAddress||s.region,
    closedDate: s.closedYear? (s.closedYear+'-01-01') : null,
    buildingArea: s.buildingArea, siteArea: s.landArea,
    utilizationPlan: s.utilizationStatus, promotionPlan: s.utilizationStatus,
    nearbyResources: [] };
}

async function post(url,body){
  const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const data=await res.json();
  if(!res.ok) throw new Error((data.code||res.status)+' : '+(data.message||''));
  return data;
}

async function runDiagnose(){
  const idea=$('idea-input').value.trim();
  if(S.mode==='exist' && idea.length<10){ alert('아이디어를 10자 이상 입력해주세요.'); return; }
  show('step-result'); $('checkpoints').innerHTML=''; $('result').innerHTML='<div class="loading">🤖 AI가 진단 중입니다…</div>';
  const school=toSchoolInput(S.school);
  try{
    if(S.mode==='exist'){
      const data=await post('/api/v1/ai/idea-evaluations',{school,idea});
      S.lastEval=data; renderIdea(data);
    } else {
      const data=await post('/api/v1/ai/recommendations',{school});
      S.lastRecs=data; renderRecs(data);
    }
  }catch(e){ $('result').innerHTML=`<div class="err">진단 실패: ${esc(e.message)}</div>`; }
}

function tags(arr,cls){ return (arr||[]).map(x=>`<span class="tag ${cls}">${esc(x)}</span>`).join(''); }
function reasonsList(arr){ return '<ul>'+(arr||[]).map(r=>`<li>${esc(r)}</li>`).join('')+'</ul>'; }

function renderRecs(d){
  let h=`<div class="card"><div style="font-size:19px;font-weight:700">${esc(S.school.name)}</div>
    <div class="muted" style="margin-top:4px">추천 활용모델 ${d.recommendations?.length||0}개 · analysisId: ${esc(d.analysisId)}</div></div>`;
  (d.recommendations||[]).forEach((r,i)=>{
    h+=`<div class="rec-card"><h3>Best ${r.rank}. ${esc(r.title)}</h3>
      <div>${esc(r.description)}</div>
      <div style="margin-top:10px"><b>장점</b><br>${tags(r.strengths,'good')}</div>
      <div style="margin-top:8px"><b>유의점</b><br>${tags(r.risks,'risk')}</div>
      <div style="margin-top:10px"><button class="ghost sm" onclick="cpFromRec(${i})">이 모델로 최종 체크포인트 생성 →</button></div></div>`;
  });
  $('result').innerHTML=h;
}
function renderIdea(d){
  const m=d.metrics||{};
  const mi=[['공간 적합성',m.spaceSuitability],['접근성',m.accessibility],['지역 수요',m.regionalDemand],['유사사례 적합성',m.similarCaseSuitability],['실행 가능성',m.executionFeasibility]];
  let h=`<div class="card"><div style="font-size:19px;font-weight:700">${esc(S.school.name)}</div>
    <div class="muted" style="margin:4px 0 8px">아이디어: ${esc(d.idea)} · evaluationId: ${esc(d.evaluationId)}</div>
    <div>종합 적합도 ${gradeBadge(d.overallGrade)}</div>
    <div style="margin-top:8px">${esc(d.summary)}</div></div>`;
  h+=`<div class="card"><h2 class="section" style="margin-top:0">세부 지표</h2>`+
    mi.map(([k,v])=>`<div class="metric"><div class="head"><span class="k">${k}</span>${gradeBadge(v&&v.grade)}</div>${reasonsList(v&&v.reasons)}</div>`).join('')+`</div>`;
  h+=`<div class="rec-card">
    <div><b>장점</b><br>${tags(d.strengths,'good')}</div>
    <div style="margin-top:10px"><b>단점/보완점</b><br>${tags(d.weaknesses,'risk')}</div>
    <div style="margin-top:10px"><b>대안 활용모델</b><br>${tags(d.alternativeModels,'alt')}</div>
    <div style="margin-top:12px"><b>보완 방향</b><div>${esc(d.recommendation)}</div></div></div>`;
  h+=`<div class="row"><button onclick="cpFromIdea()">최종 체크포인트 생성 →</button></div>`;
  $('result').innerHTML=h;
}

async function cpFromIdea(){
  const school=toSchoolInput(S.school);
  await runCheckpoints({sourceType:'IDEA_EVALUATION',analysisId:S.lastEval.evaluationId,school,ideaEvaluation:S.lastEval});
}
async function cpFromRec(i){
  const school=toSchoolInput(S.school); const r=S.lastRecs.recommendations[i];
  await runCheckpoints({sourceType:'RECOMMENDATION',analysisId:S.lastRecs.analysisId,school,selectedRecommendation:r});
}
async function runCheckpoints(body){
  $('checkpoints').innerHTML='<div class="loading">🧾 최종 체크포인트 생성 중…</div>';
  try{
    const d=await post('/api/v1/ai/final-checkpoints',body);
    let h=`<h2 class="section">최종 체크포인트 <span class="muted">checkpointId: ${esc(d.checkpointId)}</span></h2>`;
    (d.items||[]).forEach(it=>{
      h+=`<div class="cp"><div class="cat">${esc(CAT_KO[it.category]||it.category)}
        <span class="badge ${it.priority==='HIGH'?'g-lo':(it.priority==='MEDIUM'?'g-mid':'g-def')}">${PRIO_KO[it.priority]||it.priority}</span></div>
        <div class="note">${esc(it.note)}</div><div class="tip">💡 ${esc(it.tip)}</div></div>`;
    });
    $('checkpoints').innerHTML=h; $('checkpoints').scrollIntoView({behavior:'smooth'});
  }catch(e){ $('checkpoints').innerHTML=`<div class="err">체크포인트 실패: ${esc(e.message)}</div>`; }
}

loadSchools(true);
</script>
</body>
</html>
